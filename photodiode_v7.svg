<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" font-family="Helvetica,Arial,sans-serif" font-size="16">
<rect width="1000" height="720" fill="#fff"/>
<text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold">Photodiode Circuit v7 (Vishay TEPT5600) → NI USB-6421</text>
<!-- Arduino -->
<rect x="60" y="110" width="230" height="380" rx="10" fill="#e6f4ef" stroke="#00878a" stroke-width="3"/>
<text x="175" y="145" text-anchor="middle" font-size="19" font-weight="bold">NI USB-6421</text>
<text x="175" y="167" text-anchor="middle" font-size="13">AI in RSE mode</text>
<circle cx="290" cy="200" r="7"/><text x="270" y="206" text-anchor="end">+5V (pin 24)</text>
<circle cx="290" cy="330" r="7"/><text x="270" y="336" text-anchor="end">AI0</text>
<circle cx="290" cy="450" r="7"/><text x="270" y="456" text-anchor="end">AI GND</text>
<g fill="none" stroke-width="4">
<path d="M297 200 H600 V240" stroke="#d62728"/>
<path d="M600 300 V330" stroke="#ff7f0e"/>
<path d="M297 330 H600" stroke="#ff7f0e"/>
<path d="M600 330 V370" stroke="#ff7f0e"/>
<path d="M600 430 V450 H297" stroke="#000"/>
</g>
<!-- phototransistor symbol -->
<circle cx="600" cy="270" r="32" fill="#f7f7f7" stroke="#000" stroke-width="2.5"/>
<line x1="588" y1="252" x2="588" y2="288" stroke="#000" stroke-width="4"/>
<line x1="588" y1="262" x2="600" y2="245" stroke="#000" stroke-width="2.5"/>
<line x1="588" y1="278" x2="600" y2="295" stroke="#000" stroke-width="2.5"/>
<polygon points="600,295 590,290 597,284" fill="#000"/>
<g stroke="#e6b800" stroke-width="3"><line x1="530" y1="232" x2="560" y2="255"/><line x1="530" y1="262" x2="560" y2="282"/></g>
<polygon points="560,255 549,253 554,246" fill="#e6b800"/><polygon points="560,282 549,280 554,273" fill="#e6b800"/>
<text x="470" y="228" font-size="13" fill="#8a6d00">light</text>
<text x="645" y="250" font-size="15" font-weight="bold">Phototransistor</text>
<text x="645" y="270" font-size="13">collector (C) → +5V</text>
<text x="645" y="290" font-size="13">emitter (E) → AI0 · covered = 0 V</text>
<!-- resistor -->
<rect x="588" y="370" width="24" height="60" fill="#f3e2b3" stroke="#000" stroke-width="2"/>
<line x1="588" y1="385" x2="612" y2="385" stroke="#a52a2a" stroke-width="3"/>
<line x1="588" y1="395" x2="612" y2="395" stroke="#000" stroke-width="3"/>
<line x1="588" y1="405" x2="612" y2="405" stroke="#ff7f0e" stroke-width="3"/>
<text x="625" y="400" font-size="15" font-weight="bold">10 kΩ (this rig; range 2.2–10 kΩ)</text>
<text x="625" y="420" font-size="13">dark room: 10 kΩ · lit room: 2.2 kΩ</text><text x="625" y="438" font-size="13">far leg → AI GND (− rail also OK)</text>
<circle cx="600" cy="330" r="6" fill="#ff7f0e"/>
<text x="400" y="322" font-size="13">signal node (strip 30a–e)</text>
<!-- key -->
<rect x="60" y="530" width="880" height="170" rx="8" fill="#fafafa" stroke="#999"/>
<text x="80" y="560" font-weight="bold" font-size="17">Key</text>
<line x1="80" y1="590" x2="140" y2="590" stroke="#d62728" stroke-width="4"/><text x="150" y="595">5 V supply wire</text>
<line x1="80" y1="620" x2="140" y2="620" stroke="#ff7f0e" stroke-width="4"/><text x="150" y="625">Signal wire to AI0</text>
<line x1="80" y1="650" x2="140" y2="650" stroke="#000" stroke-width="4"/><text x="150" y="655">Ground wire</text>
<text x="420" y="595">More light → more current → higher AI0 voltage (0–5 V)</text>
<text x="420" y="620">Tape over the white 80 px patch, bottom-right of the monitor</text>
<text x="420" y="645">If covered reads ~0.7 V, it is reversed (limit 1.5 V)</text>
<text x="420" y="670">Measured: black 0.013 V · white 0.240 V (10 kΩ)</text>
</svg>
